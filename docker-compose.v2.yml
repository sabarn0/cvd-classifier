version: "3.9"

# v2 stack — all ports in the 70XX range, container names prefixed with v2-
# Does NOT conflict with the main stack (ports 9000, 5000, 9090, 9030)
#
# Usage:
#   docker compose -f docker-compose.v2.yml up -d
#   docker compose -f docker-compose.v2.yml down

services:
  api:
    image: ${DOCKER_IMAGE_V2:-cats-dogs-api-v2}
    build:
      context: .
      dockerfile: Dockerfile.v2
    container_name: v2-api
    ports:
      - "7000:7000"
    volumes:
      - ./logs:/app/logs
    environment:
      - MODEL_PATH=models/model.pt
      - CONFIG_PATH=models/model_config.json
      - LOG_DIR=logs
    restart: unless-stopped



  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: v2-prometheus
    volumes:
      - ./monitoring/prometheus.v2.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=24h"
    ports:
      - "7090:9090"
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.0.0
    container_name: v2-grafana
    ports:
      - "7030:7030"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SERVER_HTTP_PORT=7030
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    restart: unless-stopped
