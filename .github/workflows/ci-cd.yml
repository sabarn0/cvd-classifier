# CI/CD pipeline skeleton for when this project moves to GitHub (M3 + M4).
# It is disabled from auto-running right now (see `on:` block) so it won't
# fire before secrets/registry are configured -- flip it on when you're ready.
#
# Required repo secrets once you enable the push job:
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN   (or use GHCR with GITHUB_TOKEN)
#
name: CI-CD

on:
  workflow_dispatch:      # manual trigger for now
  # push:                 # uncomment to run on every push
  #   branches: [main]
  # pull_request:
  #   branches: [main]

env:
  IMAGE_NAME: cats-dogs-api

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      # --- Uncomment once a container registry + secrets are configured ---
