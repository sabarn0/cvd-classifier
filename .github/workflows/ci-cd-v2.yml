name: CI-CD Pipeline v2

on:
  push:
    branches: [main-v2, v2-dev]
  pull_request:
    branches: [main-v2, v2-dev]
  workflow_dispatch:

env:
  IMAGE_NAME: cats-dogs-api-v2

jobs:
  test-and-build:
    name: CI - Test & Build Container (v2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies (CPU torch for CI)
        run: |
          python -m pip install --upgrade pip
          # Install CPU torch first (no GPU in CI runner)
          pip install torch==2.3.1 torchvision==0.18.1 \
            --index-url https://download.pytorch.org/whl/cpu
          # Install remaining deps from requirements-v2.txt
          pip install optuna==3.6.1 "optuna-integration[mlflow]==3.6.0"
          pip install mlflow==2.14.1 fastapi==0.111.0 uvicorn[standard]==0.30.1 \
            python-multipart==0.0.9 prometheus-client==0.20.0 \
            prometheus-fastapi-instrumentator==7.0.0 \
            scikit-learn==1.5.0 matplotlib==3.9.0 pillow==10.3.0 \
            numpy==1.26.4 pytest==8.2.2 httpx==0.27.0

      - name: Run unit tests
        run: pytest -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image (v2)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.v2
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: CD - Deploy v2 Stack to GCP VM
    needs: test-and-build
    if: (github.ref == 'refs/heads/main-v2' || github.ref == 'refs/heads/v2-dev') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python for smoke tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install smoke-test deps
        run: pip install pillow requests

      - name: Copy v2 deployment configs to GCP VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          target: "~/app-v2"
          source: "docker-compose.v2.yml,monitoring/prometheus.v2.yml,monitoring/grafana/"

      - name: Deploy v2 stack on GCP VM (70XX ports)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          script: |
            mkdir -p ~/app-v2/logs ~/app-v2/models ~/app-v2/mlruns
            cd ~/app-v2
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            export DOCKER_IMAGE_V2=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            docker pull $DOCKER_IMAGE_V2
            # Only stop v2 containers — do NOT touch main stack (cvd-api, cvd-prometheus, etc.)
            docker rm -f v2-api v2-prometheus v2-grafana v2-mlflow 2>/dev/null || true
            docker compose -f docker-compose.v2.yml down --remove-orphans 2>/dev/null || true
            docker compose -f docker-compose.v2.yml up -d --remove-orphans --force-recreate

      - name: Wait for v2 services to warm up
        run: sleep 15

      - name: Run post-deploy smoke test (v2 API on port 7000)
        run: |
          bash scripts/smoke_test.sh http://${{ secrets.GCP_VM_HOST }}:7000
