version: "3.9"

services:
  api:
    image: ${DOCKER_IMAGE:-cats-dogs-api}
    build: .
    container_name: cvd-api
    ports:
      - "9000:9000"
    volumes:
      - ./logs:/app/logs
    environment:
      - MODEL_PATH=models/model.pt
      - LOG_DIR=logs
    restart: unless-stopped

  mlflow:
    image: python:3.11-slim
    container_name: cvd-mlflow
    working_dir: /mlflow
    volumes:
      - ./mlruns:/mlflow/mlruns
    ports:
      - "5000:5000"
    command: >
      bash -c "pip install --no-cache-dir mlflow==2.14.1 &&
               mlflow server --host 0.0.0.0 --port 5000
               --backend-store-uri /mlflow/mlruns
               --default-artifact-root /mlflow/mlruns"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: cvd-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=24h"
    ports:
      - "9090:9090"
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.0.0
    container_name: cvd-grafana
    ports:
      - "9030:9030"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SERVER_HTTP_PORT=9030
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    restart: unless-stopped
